version: 0.1.0
homepage: https://github.com/muhammadsaddamnur/center_spot
repository: https://github.com/muhammadsaddamnur/center_spot
issue_tracker: https://github.com/muhammadsaddamnur/center_spot/issues
topics:
  - preview
  - responsive
  - viewport
  - development

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.11.4
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
